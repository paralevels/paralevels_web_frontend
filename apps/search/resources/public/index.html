<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search</title>
    <link rel="stylesheet" type="text/css" href="/css/index.css">
</head>
<body>
    <form id="search-form">
        <input type="text" id="query" name="query" placeholder="Enter search term" required>
        <button type="submit">Search</button>
    </form>
    <div id="search-results"></div>

    <script>
        const form = document.getElementById('search-form');
        const resultsDiv = document.getElementById('search-results');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent form submission
            const query = document.getElementById('query').value;

            // Clear previous results
            resultsDiv.innerHTML = '';

            // Fetch data from the search API
            fetch(`http://localhost:8080/search?query=${encodeURIComponent(query)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Populate the results in the search-results div
                    if (Array.isArray(data) && data.length > 0) {
                        data.forEach(item => {
                            // Create search result nodes
                            const itemDiv = document.createElement('div');
                            const itemImg = document.createElement('img');
                            const itemCaptions = document.createElement('div');
                            const itemLabels = document.createElement('div');
                            // Assign class names
                            itemDiv.className = 'search-result';
                            itemCaptions.className = 'captions';
                            itemLabels.className = 'labels';
                            // Link image src to the host
                            itemImg.src = 'http://192.168.0.16/static/img' + item.filepath;
                            // Put captions and labels as text
                            itemCaptions.textContent = 'Captions: ' + item.captions.join(' ');
                            itemLabels.textContent = 'Labels: ' + item.labels.join(' ');
                            // Append nodes
                            itemDiv.appendChild(itemImg);
                            itemDiv.appendChild(itemCaptions);
                            itemDiv.appendChild(itemLabels);
                            resultsDiv.appendChild(itemDiv);
                        });
                    } else {
                        resultsDiv.textContent = 'No results found.';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    resultsDiv.textContent = 'An error occurred while fetching search results.';
                });
        });
    </script>

</html>
